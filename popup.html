<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body {
    width: 260px;
    margin: 0;
    padding: 16px;
    background: #171D27;
    color: #E7E5DF;
    font-family: 'Segoe UI', sans-serif;
    font-size: 13px;
  }
  h1 {
    font-size: 15px;
    margin: 0 0 8px 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #6C8EF5; box-shadow: 0 0 8px #6C8EF5;
  }
  p { color: #8A93A3; line-height: 1.5; margin: 8px 0; }
  .status { font-family: monospace; font-size: 11px; color: #4F9B7E; }
</style>
</head>
<body>
  <h1><span class="dot"></span>Signal</h1>
  <p>Open any email in Gmail — a risk badge will appear in the bottom-right corner showing the phishing score and why.</p>
  <p class="status">● Active on mail.google.com</p>
</body>
</html>
