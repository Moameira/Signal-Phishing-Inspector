<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal — Phishing Inspector</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root {
    --bg: #10141B;
    --panel: #171D27;
    --panel-border: #262E3C;
    --text: #E7E5DF;
    --text-dim: #8A93A3;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'Space Grotesk', sans-serif;
    --safe: #4F9B7E;
    --caution: #D4A34C;
    --danger: #C4544A;
    --accent: #6C8EF5;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    padding: 40px 20px;
  }

  .wrap {
    max-width: 1080px;
    margin: 0 auto;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 32px;
    border-bottom: 1px solid var(--panel-border);
    padding-bottom: 20px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-mark {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
  }

  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .tagline {
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.02em;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  @media (max-width: 860px) {
    .grid { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 24px;
  }

  .panel-label {
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin-bottom: 16px;
  }

  label.field-label {
    display: block;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 6px;
    margin-top: 14px;
  }

  label.field-label:first-child { margin-top: 0; }

  input, textarea {
    width: 100%;
    background: #0D1119;
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 10px 12px;
    resize: vertical;
  }

  textarea { min-height: 140px; line-height: 1.5; }

  input:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
  }

  button {
    margin-top: 20px;
    width: 100%;
    background: var(--accent);
    color: #0D1119;
    border: none;
    border-radius: 6px;
    padding: 12px;
    font-family: var(--sans);
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }

  button:hover { opacity: 0.88; }
  button:active { opacity: 0.75; }

  .sample-links {
    margin-top: 10px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
  }
  .sample-links a {
    color: var(--accent);
    cursor: pointer;
    text-decoration: none;
    margin-right: 14px;
  }
  .sample-links a:hover { text-decoration: underline; }

  /* Results panel */
  .gauge-row {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 20px;
  }

  .gauge {
    position: relative;
    width: 120px;
    height: 120px;
    flex-shrink: 0;
  }

  .gauge svg { width: 100%; height: 100%; transform: rotate(-90deg); }

  .gauge-track { fill: none; stroke: var(--panel-border); stroke-width: 8; }
  .gauge-fill {
    fill: none;
    stroke-width: 8;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.6s ease, stroke 0.3s ease;
  }

  .gauge-score {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .gauge-score .num {
    font-family: var(--mono);
    font-size: 26px;
    font-weight: 600;
  }
  .gauge-score .pct {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
  }

  .verdict-block .verdict {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .verdict-block .sub {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
  }

  .signal-log {
    font-family: var(--mono);
    font-size: 12px;
  }

  .signal-item {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--panel-border);
    line-height: 1.5;
  }
  .signal-item:last-child { border-bottom: none; }

  .signal-item .weight {
    flex-shrink: 0;
    color: var(--text-dim);
  }

  .empty-state {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    padding: 20px 0;
    text-align: center;
  }

  .placeholder {
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 12px;
    text-align: center;
    padding: 40px 0;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="brand-mark"></div>
      <div>
        <h1>Signal</h1>
        <div class="tagline">phishing inspector — v1 heuristic engine</div>
      </div>
    </div>
  </header>

  <div class="grid">
    <div class="panel">
      <div class="panel-label">Input</div>

      <label class="field-label">From (full header)</label>
      <input id="from" placeholder='"PayPal Support" &lt;security@paypa1-verify.xyz&gt;'>

      <label class="field-label">Reply-To (optional)</label>
      <input id="replyTo" placeholder="noreply@some-domain.ru">

      <label class="field-label">Subject</label>
      <input id="subject" placeholder="URGENT: Your account will be closed">

      <label class="field-label">Body</label>
      <textarea id="body" placeholder="Paste the email body here..."></textarea>

      <button onclick="runAnalysis()">Scan email</button>

      <div class="sample-links">
        Try: <a onclick="loadSample('phishing')">phishing example</a><a onclick="loadSample('legit')">legit example</a>
      </div>
    </div>

    <div class="panel">
      <div class="panel-label">Result</div>
      <div id="results">
        <div class="placeholder">Scan an email to see its risk breakdown</div>
      </div>
    </div>
  </div>
</div>

<script src="engine.js"></script>
<script>
function colorForScore(score) {
  if (score >= 70) return getComputedStyle(document.documentElement).getPropertyValue('--danger').trim();
  if (score >= 40) return getComputedStyle(document.documentElement).getPropertyValue('--caution').trim();
  if (score >= 20) return getComputedStyle(document.documentElement).getPropertyValue('--caution').trim();
  return getComputedStyle(document.documentElement).getPropertyValue('--safe').trim();
}

function runAnalysis() {
  const from = document.getElementById('from').value;
  const replyTo = document.getElementById('replyTo').value;
  const subject = document.getElementById('subject').value;
  const body = document.getElementById('body').value;

  const result = window.PhishingEngine.analyzeEmail({ from, replyTo, subject, body });
  renderResult(result);
}

function renderResult(result) {
  const { score, verdict, signals } = result;
  const color = colorForScore(score);
  const circumference = 2 * Math.PI * 50;
  const offset = circumference - (score / 100) * circumference;

  let signalsHtml = '';
  if (signals.length === 0) {
    signalsHtml = '<div class="empty-state">No suspicious signals detected</div>';
  } else {
    signalsHtml = signals.map(s => `
      <div class="signal-item">
        <span>${s.label}</span>
        <span class="weight">+${s.weight}</span>
      </div>
    `).join('');
  }

  document.getElementById('results').innerHTML = `
    <div class="gauge-row">
      <div class="gauge">
        <svg viewBox="0 0 120 120">
          <circle class="gauge-track" cx="60" cy="60" r="50"></circle>
          <circle class="gauge-fill" cx="60" cy="60" r="50"
            stroke="${color}"
            stroke-dasharray="${circumference}"
            stroke-dashoffset="${offset}"></circle>
        </svg>
        <div class="gauge-score">
          <div class="num" style="color:${color}">${score}</div>
          <div class="pct">/ 100</div>
        </div>
      </div>
      <div class="verdict-block">
        <div class="verdict" style="color:${color}">${verdict}</div>
        <div class="sub">${signals.length} signal${signals.length === 1 ? '' : 's'} detected</div>
      </div>
    </div>
    <div class="signal-log">${signalsHtml}</div>
  `;
}

const SAMPLES = {
  phishing: {
    from: '"PayPal Support" <security@paypa1-verify.xyz>',
    replyTo: 'noreply@some-other-domain.ru',
    subject: 'URGENT: Your account will be closed - verify your account now',
    body: 'Dear Customer, we detected unusual activity. Please confirm your identity within 24 hours by clicking here: http://192.168.10.5/login and enter your password to avoid suspension.'
  },
  legit: {
    from: '"Sarah from the team" <sarah@mycompany.com>',
    replyTo: 'sarah@mycompany.com',
    subject: 'Notes from our call today',
    body: 'Hi! Thanks for the great conversation earlier. I attached the summary doc, let me know if you have questions.'
  }
};

function loadSample(key) {
  const s = SAMPLES[key];
  document.getElementById('from').value = s.from;
  document.getElementById('replyTo').value = s.replyTo;
  document.getElementById('subject').value = s.subject;
  document.getElementById('body').value = s.body;
  runAnalysis();
}
</script>
</body>
</html>
